<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse | Reserva de cancha</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
    <main class="auth-page">
        <section class="auth-card">
            <div class="auth-brand">
                <span class="logo">ReservaCancha</span>
                <p>Creá tu cuenta y reservá en pocos minutos.</p>
            </div>

            <h1>Crear cuenta</h1>

            <form class="auth-form">
                <div class="form-group">
                    <label for="name">Nombre completo</label>
                    <input type="text" id="name" placeholder="Tu nombre" required>
                </div>

                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" placeholder="tu@email.com" required>
                </div>

                <div class="form-group">
                    <label for="phone">Teléfono</label>
                    <input type="tel" id="phone" placeholder="11 2345-6789" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirmar contraseña</label>
                    <input type="password" id="confirm-password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-block">Registrarme</button>
            </form>

            <p class="auth-footer">¿Ya tenés cuenta? <a href="login.html">Iniciar sesión</a></p>
        </section>
    </main>
</body>
</html>
