<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Reserva de cancha</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
    <main class="auth-page">
        <section class="auth-card">
            <div class="auth-brand">
                <span class="logo">ReservaCancha</span>
                <p>Accedé a tu cuenta y reservá tu turno.</p>
            </div>

            <h1>Iniciar sesión</h1>

            <form onsubmit="login(); return false;" class="auth-form">
                <div class="form-group">
                    <label for="email-input">Correo electrónico</label>
                    <input type="email" id="email-input" placeholder="tu@email.com" required>
                </div>

                <div class="form-group">
                    <label for="password-input">Contraseña</label>
                    <input type="password" id="password-input" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-block">Entrar</button>

            </form>

  

            <p class="auth-footer">¿No tenés cuenta? <a href="register.html">Crear cuenta</a></p>
        </section>
    </main>

    <script src="scripts.js"></script>
</body>
</html>
